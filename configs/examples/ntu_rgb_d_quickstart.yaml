# NTU-RGB+D real-data example. Not a CI/default test target -- it requires
# a real NTU-RGB+D subset under data/ (gitignored, not committed to the
# repo). For the paths below to exist, first run
# scripts/dataset_prep/ntu_rgb_d.py (a reproducible selection method: sort
# by video_key, then keep only the classes given via --actions, so the
# result is identical on every run).
#
#   python scripts/dataset_prep/ntu_rgb_d.py \
#     --rgb-root data/nturgb+d_rgb \
#     --skeleton-root data/nturgbd_skeletons_s001_to_s017/nturgb+d_skeletons \
#     --split xsub --num-frames 16 \
#     --actions 8,9,23 \
#     --limit 24 \
#     --out data/ntu_rgb_d_quickstart
#
# --actions 8,9,23 are sitting down/standing up/hand waving -- three
# classes picked only because their limb motion is pronounced enough to
# visually verify against the skeleton_parts mask; the choice carries no
# other significance. To try a different subset, change --out and update
# this file's manifest/bbox_data paths to match.
schema_version: 1.0.0
source:
  kind: video_manifest
  manifest: ../../data/ntu_rgb_d_quickstart/video_manifest.json
  num_frames: 16
adapter:
  provider: torchvision_video
  model_name: r3d_18
  weights: null
  device: cpu
  max_batch_size: 2
skeleton_source:
  bbox_data: ../../data/ntu_rgb_d_quickstart/skeleton_bbox.json
regions:
  - region_id: occlude_left_arm
    kind: skeleton_parts
    params:
      body_part: left_arm
      bbox_scale: 1.15
perturbations:
  - op: constant_fill
    params:
      value: [0, 0, 0]
runtime:
  variants_per_chunk: 2
  target_batch_size: 2
  num_workers: 0
dump:
  flush_every: 8
