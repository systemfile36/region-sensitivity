[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssat"
version = "1.0.0"
description = "Spatial Sensitivity Audit Toolkit"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ssat = "ssat.cli:main"

[tool.setuptools.packages.find]
include = ["ssat*"]
