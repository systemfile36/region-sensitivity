[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssat"
version = "1.0.0"
description = "Spatial Sensitivity Audit Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "systemfile36", email = "systemfile36@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    # Bounds below pin the major/minor line last verified by the full test
    # suite (see docs/internal/SOFTWARE_MATURITY_AUDIT_v1.md SS3.2) and allow
    # patch/minor upgrades within it while blocking untested major bumps.
    "numpy~=2.3",
    "pandas~=3.0",
    "pyarrow~=25.0",
    "pydantic>=2,<3",
    "typer~=0.27",
    "pyyaml~=6.0",
    "timm~=1.0",
    "jinja2~=3.1",
    "opencv-python-headless~=5.0",
    "pillow~=11.0",
    "decord~=0.6",
    "tqdm~=4.67",
    "matplotlib~=3.11",
]

[project.optional-dependencies]
dev = ["pytest"]
reference = ["captum==0.9.0"]

[project.urls]
Repository = "https://github.com/systemfile36/region-sensitivity"
Issues = "https://github.com/systemfile36/region-sensitivity/issues"

[project.scripts]
ssat = "ssat.cli:main"

[tool.setuptools.packages.find]
include = ["ssat*"]
